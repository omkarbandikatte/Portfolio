<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Omkar Bandikatte logo</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="#050807"/>
  <rect x="10" y="10" width="492" height="492" rx="94" fill="none" stroke="#4ade80" stroke-opacity=".18" stroke-width="2"/>
  <g transform="translate(59 166)">
    <path d="M18 31 116 84 18 137v-34l63-19-63-19Z" fill="url(#accent)" filter="url(#glow)"/>
    <text x="132" y="139" fill="#f5f5f7" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="150" font-weight="600" letter-spacing="-12">ob</text>
    <rect x="330" y="12" width="62" height="146" rx="5" fill="url(#accent)">
      <animate attributeName="opacity" values="1;1;.28;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
